name: Cassini
configs:
  Debug: debug
  Release: release
  Internal: release
options:
  bundleIdPrefix: io.codemyriad
  deploymentTarget:
    iOS: '26.0'
packages:
  Cassini:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: '4LS8W738Y3'
  configs:
    Internal:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) CASSINI_INTERNAL_TESTFLIGHT'
targets:
  Cassini:
    type: application
    platform: iOS
    # CassiniShared is also compiled into the CassiniActivity widget extension.
    sources: [Cassini, CassiniShared]
    dependencies:
      - target: CassiniActivity
      - package: Cassini
        product: CassiniCore
      - package: Cassini
        product: CassiniNotebook
      - package: Cassini
        product: CassiniEngine
      - package: Cassini
        product: CassiniAudio
      - package: Cassini
        product: CassiniInference
      - package: Cassini
        product: CassiniWhistle
      # The sherpa-onnx runtime: the release xcframeworks, or the local build with CASSINI_SHERPA_LOCAL=1 (Package.swift).
      - package: Cassini
        product: CassiniSherpa
      # Imported only in Debug builds, for UI-test launches.
      - package: Cassini
        product: CassiniEngineTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini
        INFOPLIST_FILE: Cassini/Resources/Info.plist
        # A higher memory limit where the device allows it, for the on-device models.
        CODE_SIGN_ENTITLEMENTS: Cassini/Cassini.entitlements
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '4'
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    postBuildScripts:
      - name: Bundle the pinned private Whistle runtime and weights
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          /usr/bin/python3 "$SRCROOT/scripts/bundle-whistle.py" --cache "${CASSINI_WHISTLE_CACHE:-$SRCROOT/.tools/whistle}"
      # SherpaOnnxC and onnxruntime are static xcframeworks, linked into the app binary. Xcode still embeds a stub
      # framework for each, which the app never loads and whose Info.plist minimum OS need not match its binary:
      # App Store Connect rejected build 3 for that (90208). Drop them before the app is signed.
      - name: Drop the static runtime's stub frameworks
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          frameworks="${TARGET_BUILD_DIR:?}/${FRAMEWORKS_FOLDER_PATH:?}"
          for name in SherpaOnnxC onnxruntime; do
            rm -rf "$frameworks/$name.framework"
          done
          rmdir "$frameworks" 2>/dev/null || true
  # The recording's Live Activity (Lock Screen and Dynamic Island).
  CassiniActivity:
    type: app-extension
    platform: iOS
    sources:
      - CassiniActivity
      - CassiniShared
      - path: Cassini/Resources/Strings/Recording.xcstrings
    dependencies:
      - package: Cassini
        product: CassiniNotebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.activity
        INFOPLIST_FILE: CassiniActivity/Info.plist
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '4'
        SWIFT_EMIT_LOC_STRINGS: YES
  CassiniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CassiniUITests]
    dependencies:
      - target: Cassini
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CassiniTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CassiniTests]
    dependencies:
      - target: Cassini
      - package: Cassini
        product: CassiniCore
      - package: Cassini
        product: CassiniNotebook
      - package: Cassini
        product: CassiniEngine
      - package: Cassini
        product: CassiniEngineTesting
      - package: Cassini
        product: CassiniAudio
      - package: Cassini
        product: CassiniInference
      - package: Cassini
        product: CassiniSherpa
      - package: Cassini
        product: CassiniWhistle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cassini:
    build:
      targets:
        Cassini: all
        CassiniUITests: [test]
        CassiniTests: [test]
    test:
      targets: [CassiniTests, CassiniUITests]
  CassiniInternal:
    build:
      targets:
        Cassini: all
    run:
      config: Internal
    archive:
      config: Internal
