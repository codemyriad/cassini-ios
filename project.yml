name: Cassini
options:
  bundleIdPrefix: io.codemyriad
  deploymentTarget:
    iOS: '26.0'
packages:
  Cassini:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: '4LS8W738Y3'
targets:
  Cassini:
    type: application
    platform: iOS
    # CassiniShared is also compiled into the CassiniActivity widget extension.
    sources: [Cassini, CassiniShared]
    dependencies:
      - target: CassiniActivity
      - package: Cassini
        product: CassiniCore
      - package: Cassini
        product: CassiniNotebook
      - package: Cassini
        product: CassiniEngine
      - package: Cassini
        product: CassiniAudio
      - package: Cassini
        product: CassiniInference
      # The sherpa-onnx runtime: the release xcframeworks, or the local build with CASSINI_SHERPA_LOCAL=1 (Package.swift).
      - package: Cassini
        product: CassiniSherpa
      # Imported only in Debug builds, for UI-test launches.
      - package: Cassini
        product: CassiniEngineTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini
        INFOPLIST_FILE: Cassini/Resources/Info.plist
        # A higher memory limit where the device allows it, for the on-device models.
        CODE_SIGN_ENTITLEMENTS: Cassini/Cassini.entitlements
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '2'
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
  # The recording's Live Activity (Lock Screen and Dynamic Island).
  CassiniActivity:
    type: app-extension
    platform: iOS
    sources:
      - CassiniActivity
      - CassiniShared
      - path: Cassini/Resources/Strings/Recording.xcstrings
    dependencies:
      - package: Cassini
        product: CassiniNotebook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.codemyriad.cassini.activity
        INFOPLIST_FILE: CassiniActivity/Info.plist
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '2'
        SWIFT_EMIT_LOC_STRINGS: YES
  CassiniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CassiniUITests]
    dependencies:
      - target: Cassini
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CassiniTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CassiniTests]
    dependencies:
      - target: Cassini
      - package: Cassini
        product: CassiniCore
      - package: Cassini
        product: CassiniNotebook
      - package: Cassini
        product: CassiniEngine
      - package: Cassini
        product: CassiniEngineTesting
      - package: Cassini
        product: CassiniAudio
      - package: Cassini
        product: CassiniInference
      - package: Cassini
        product: CassiniSherpa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cassini:
    build:
      targets:
        Cassini: all
        CassiniUITests: [test]
        CassiniTests: [test]
    test:
      targets: [CassiniTests, CassiniUITests]
