# An off-host check of what drmeyers' gate cannot see: a clean checkout with nothing but the repository, cassini-format
# and the network. It runs `scripts/test.sh fast` (the string catalogs and the Swift package tests, with the
# conformance vectors required) and `scripts/test.sh build` (the app, its extension and the test bundles, built for the
# iOS Simulator, then checked that no embedded binary needs a newer iOS than the app). The simulator tiers (hosted and
# UI tests) stay local: the merge gate is the drmeyers/test-all status that `CASSINI_POST_STATUS=1 scripts/test.sh all`
# posts (D66).
#
# Pull requests keep the code path filter. Every main push runs, including docs/tooling-only merges,
# so unattended TestFlight always has an exact-head CI result to check.
name: CI

on:
  pull_request:
    paths:
      - 'Cassini/**'
      - 'CassiniActivity/**'
      - 'CassiniShared/**'
      - 'CassiniTests/**'
      - 'CassiniUITests/**'
      - 'Packages/**'
      - 'Whistle/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'project.yml'
      - 'scripts/test.sh'
      - 'scripts/test-events.py'
      - 'scripts/test-test-events.py'
      - 'scripts/test-swift-test-product.py'
      - 'scripts/*embedded-minos.py'
      - 'scripts/test-test-runtime.py'
      - 'scripts/check-strings.sh'
      - 'scripts/*whistle*.py'
      - 'scripts/run-in-gui.py'
      - 'scripts/test-run-in-gui.py'
      - 'scripts/test-ci-runner-selection.py'
      - 'scripts/pr-shots*'
      - 'scripts/screenshot-manifest.py'
      - 'scripts/screenshots.sh'
      - 'scripts/test-pr-shots-local.py'
      - 'scripts/*status-badge*.py'
      - 'scripts/*meeting-strings*.py'
      - 'scripts/*library-strings*.py'
      - 'scripts/*brand*.py'
      - 'scripts/*testflight*'
      - 'scripts/launchd/**'
      - '.github/workflows/daily-testflight.yml'
      - '.github/workflows/ci.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '53 2 * * *'
  workflow_dispatch:

# A newer push to a PR cancels that PR's older code-push run, while labeled runs use their own
# non-cancelling group so opened/synchronize + labeled on the same head never leave CANCELLED jobs
# (UNSTABLE check rollup); a push to main, nightly schedule, or manual run is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' && format('pr-{0}-label-{1}', github.event.pull_request.number, github.run_id) || format('pr-{0}', github.event.pull_request.number)) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

env:
  CASSINI_PERF_GATE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '1' || '' }}

permissions:
  contents: read

jobs:
  # These regressions use isolated temporary fixtures, not the package/build outputs. Running them in their own
  # job removes the ~95 s serial prefix when a second runner is free. Each job keeps its own checkout and logs.
  harness:
    name: Harness regressions
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'full-ci' }}
    # CM_MAC_RUNNER=cm-mac-m4 moves trusted runs (push, schedule, workflow_dispatch, or same-repo PR) to the
    # self-hosted Apple Silicon runners; fork PRs, unallowlisted events, and any other variable value keep xcode-27.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_MAC_RUNNER == 'cm-mac-m4' && fromJSON('["self-hosted","macOS","ARM64","cm-mac-m4"]') || 'xcode-27' }}
    timeout-minutes: 20
    env:
      CASSINI_CONFORMANCE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: cassini-ios
          # The no-visual-change plumbing generator verifies its frozen public baseline.
          fetch-depth: 0
      - name: Check generated brand colours and literal boundaries
        working-directory: cassini-ios
        run: |
          python3 scripts/generate-brand-colors.py --check
          python3 scripts/test-brand-colors.py
          python3 scripts/test-check-brand-upstream.py
      - name: Compare brand bytes with pinned cassini-ux source
        # The private source is read with the trusted runner's existing read-only gh access.
        # Fork jobs remain on hosted runners and run offline checks without private access.
        if: github.repository == 'codemyriad/cassini-ios' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        working-directory: cassini-ios
        run: python3 scripts/check-brand-upstream.py
      - name: Test harness regressions
        working-directory: cassini-ios
        run: |
          python3 scripts/generate-status-badge-strings.py --check
          python3 scripts/generate-meeting-strings.py --check
          python3 scripts/generate-library-strings.py --check
          python3 scripts/test-library-strings.py
          python3 scripts/test-status-badge-strings.py
          python3 Packages/CassiniNotebook/Tests/CassiniNotebookTests/Resources/status-badges/vectors/states/verify.py
          python3 Packages/CassiniNotebook/Tests/CassiniNotebookTests/Resources/status-badges/vectors/states/test_contract.py
          python3 scripts/test-ci-runner-selection.py
          python3 scripts/test-daily-testflight.py
          python3 scripts/test-testflight-archive.py
          python3 scripts/test-test-events.py
          python3 scripts/test-swift-test-product.py
          command -v python3.12 >/dev/null || brew install python@3.12
          python3.12 -m venv "$RUNNER_TEMP/pr-shots-venv"
          "$RUNNER_TEMP/pr-shots-venv/bin/pip" install --isolated Pillow==11.3.0
          "$RUNNER_TEMP/pr-shots-venv/bin/python" -I scripts/pr-shots.py --self-test
          "$RUNNER_TEMP/pr-shots-venv/bin/python" scripts/test-pr-shots-local.py
          python3 scripts/test-check-embedded-minos.py
          python3 scripts/test-test-runtime.py
      - name: Whistle pinned-input, SDK closure and runtime-export regressions
        working-directory: cassini-ios
        run: |
          python3 scripts/test-bundle-whistle.py
          python3 scripts/test-check-whistle-runtime-exports.py
      - name: GUI runner event and lifecycle regressions
        working-directory: cassini-ios
        run: python3 scripts/test-run-in-gui.py

  fast-and-build:
    name: Package tests and build
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'full-ci' }}
    # Xcode 27.0 (27A266a), the build drmeyers' gate uses. Hosted runners have Xcode 27 only on this preview image; the
    # GA macos-26 image's Xcode 26.6 (Swift 6.2) does not compile the package tests. Trusted runs with
    # CM_MAC_RUNNER=cm-mac-m4 use the self-hosted Apple Silicon runners; fork PRs and unset values keep xcode-27.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && vars.CM_MAC_RUNNER == 'cm-mac-m4' && fromJSON('["self-hosted","macOS","ARM64","cm-mac-m4"]') || 'xcode-27' }}
    # About 3x the measured run (6.3 min from a cold runner: package tests 3.9, build 2.0; plus ~1.5 min hosted tests
    # on nightly/full-ci), so a hang frees the org's shared macOS slot.
    timeout-minutes: 30
    env:
      CASSINI_CONFORMANCE_REQUIRED: '1'
      CASSINI_KEEP_SIMS: '0'
      CASSINI_UI_WORKERS: '0'
      CASSINI_LOCK_MINUTES: '15'
    steps:
      - uses: actions/checkout@v5
        with:
          path: cassini-ios
      # Beside the repository, where scripts/test.sh looks for the conformance vectors.
      - uses: actions/checkout@v5
        with:
          repository: codemyriad/cassini-format
          ref: 32f37a6200c88bdd4d23c1f44497f1761f3401da
          path: cassini-format
      # A named path, not a glob or the image's default (Xcode 27.1 there): a new default must not change the toolchain.
      - name: Select Xcode 27.0
        run: |
          test -d /Applications/Xcode_27.0.app || { echo "::error::Xcode 27.0 is not on this image"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: String catalogs and package tests
        working-directory: cassini-ios
        run: scripts/test.sh fast
      - name: Build for testing (and hosted tests on nightly / full-ci)
        working-directory: cassini-ios
        run: |
          if [ "${CASSINI_PERF_GATE:-}" = "1" ]; then
            runner_slug=$(printf '%s' "${RUNNER_NAME:-hosted}" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')
            prefix="ts-ci-perf-${runner_slug:-hosted}"
            printf 'CASSINI_SIM_PREFIX=%s\n' "$prefix" >> "$GITHUB_ENV"
            export CASSINI_SIM_PREFIX="$prefix"
            scripts/test.sh clean
            # scripts/test.sh app acquires ~/.cassini-heavy.lock itself via start_heavy/take_heavy_lock;
            # wrapping in heavy-run without CASSINI_HEAVY_LOCK_HELD=1 would self-deadlock on the lock.
            scripts/test.sh app
            grep -E "^Test Case '-\[CassiniTests\.LibraryScreenTests testAThousandNotesFilterWithoutDroppingFrames\]' passed \(" DerivedData.noindex/test-logs/hosted.log
            grep -F "(CASSINI_PERF_GATE=1)" DerivedData.noindex/test-logs/hosted.log
          else
            scripts/test.sh build
          fi
      # Upload failure logs before `scripts/test.sh clean` rotates DerivedData.noindex/test-logs to test-logs.previous.
      - uses: actions/upload-artifact@v5
        if: failure()
        continue-on-error: true
        with:
          name: test-logs-${{ github.sha }}
          path: cassini-ios/DerivedData.noindex/test-logs
          retention-days: 14
      - name: Remove only this run's simulator clones
        if: always() && env.CASSINI_PERF_GATE == '1' && env.CASSINI_SIM_PREFIX != ''
        working-directory: cassini-ios
        run: scripts/test.sh clean
